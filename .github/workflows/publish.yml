name: Publish to npm
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
# Publishes with npm trusted publishing (OIDC): no NPM_TOKEN secret to expire
# or leak. Requires a trusted publisher configured once on npmjs.com for this
# repo and workflow file, and npm CLI >= 11.5.1 (Node 24 ships it).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url: with it, setup-node writes an .npmrc holding a
      # placeholder auth token, and npm sends that token instead of
      # exchanging the OIDC identity (E404 on PUT).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm with trusted publishing support (>= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          test "$TAG" = "$PKG" || { echo "tag $TAG != package.json $PKG"; exit 1; }

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn typecheck

      - name: Test
        run: yarn test --no-coverage

      - name: Build
        run: yarn prepare

      - name: Publish
        run: npm publish --access public --provenance
