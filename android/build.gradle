buildscript {
  ext.Unilitix = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 21,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return Unilitix[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


allprojects {
  repositories {
    google()
    mavenCentral()
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// Runs codegen for src/NativeUnilitix.ts and the UnilitixMaskView /
// UnilitixUnmaskView components (package.json "codegenConfig").
apply plugin: "com.facebook.react"

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") &&
    rootProject.getProperty("newArchEnabled") == "true"
}

// The version the SDK reports as its wrapper (Unilitix.setWrapper):
// package.json is the single source of truth.
def unilitixPackageVersion() {
  def pkg = new groovy.json.JsonSlurper().parse(file("../package.json"))
  return pkg.version
}

android {
  namespace "com.unilitix"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    consumerProguardFiles "consumer-rules.pro"
    targetSdkVersion getExtOrDefault("targetSdkVersion")
    buildConfigField "String", "PACKAGE_VERSION", "\"${unilitixPackageVersion()}\""
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        // UnilitixSpec = the codegen'd NativeUnilitixSpec (TurboModule).
        java.srcDirs += [
          "src/newarch",
          "${project.buildDir}/generated/source/codegen/java"
        ]
      } else {
        // UnilitixSpec = a bridge module with the same methods.
        java.srcDirs += ["src/oldarch"]
      }
    }
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation 'com.unilitix:unilitix-android:1.11.2'
}
